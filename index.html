<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JAKS Engineering Lab creates custom products, 3D printed items, smart devices, repairs and practical technical solutions for people and small businesses in New York and New Jersey." />
  <title>JAKS Engineering Lab | Custom Products & Smart Technical Solutions</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app-status" class="app-status" role="status">
    Loading JAKS Engineering Lab… If you opened this file directly, run <strong>npm start</strong> and open <strong>http://localhost:4173/</strong>.
  </div>
  <header id="header"></header>
  <main>
    <section id="hero"></section>
    <section id="services"></section>
    <section id="products"></section>
    <section id="gallery"></section>
    <section id="projects"></section>
    <section id="how-it-works"></section>
    <section id="about"></section>
    <section id="contact"></section>
  </main>
  <footer id="footer"></footer>
  <div id="whatsapp-button"></div>
  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('app-status').innerHTML = 'This website uses ES modules and cannot run by double-clicking index.html. Open a terminal in this folder, run <strong>npm start</strong>, then visit <strong>http://localhost:4173/</strong>.';
    }
  </script>
  <script type="module" src="./script.js"></script>
</body>
</html>
